# Netlify hosts the app and the wallet API.
#
# The API (netlify/functions/api.mjs) is plain request/response, so it runs as a
# serverless function. The BATTLE RELAY cannot: it holds WebSocket connections
# open, which Netlify Functions do not support. Deploy the relay separately to a
# Node host (see render.yaml / Dockerfile) and point VITE_WS_URL at it.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# The wallet API. Declared before the SPA fallback so /api/* is never rewritten
# to index.html.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Single-page app: every other path serves index.html so ?room=... invite links
# resolve on a hard refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# Hashed filenames are immutable, so they can be cached hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must never be served stale, or clients pin an old build.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
